# ============================================================================
#  Base nginx configuration for OpenTAKServer.
#
#  This is the stock nginx.conf plus a stream{} block, which the default image
#  does not ship. The stream block is what lets us terminate TLS for MQTT on
#  port 8883 and forward it to RabbitMQ.
# ============================================================================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Rendered from /etc/nginx/templates by the standard nginx entrypoint.
    include /etc/nginx/conf.d/*.conf;
}

stream {
    log_format stream '$remote_addr [$time_local] $protocol $status '
                      '$bytes_sent $bytes_received $session_time';

    access_log /var/log/nginx/stream-access.log stream;

    # Rendered from /etc/nginx/stream-templates by 25-envsubst-on-stream-templates.sh
    include /etc/nginx/stream.d/*.conf;
}
