# ============================================================================
#  RabbitMQ settings for OpenTAKServer
# ============================================================================

# OpenTAKServer still uses transient non-exclusive queues.
deprecated_features.permit.transient_nonexcl_queues = true

# Plain MQTT listener. This is never published to the host - nginx terminates
# TLS on 8883 and forwards here.
mqtt.listeners.tcp.default = 1883

# Two-stage authentication:
#   1. internal - the RabbitMQ user OpenTAKServer itself connects with
#   2. http     - MQTT clients (Meshtastic and friends) authenticated against
#                 OpenTAKServer's own user database
auth_backends.1 = internal
auth_backends.2 = http

auth_http.http_method   = post
auth_http.user_path     = http://opentakserver:8081/api/rabbitmq/auth
auth_http.vhost_path    = http://opentakserver:8081/api/rabbitmq/vhost
auth_http.resource_path = http://opentakserver:8081/api/rabbitmq/resource
auth_http.topic_path    = http://opentakserver:8081/api/rabbitmq/topic
